<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Reset Password — TAQWASTEPS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a84c;--gold-light:#e8c96a;
  --teal-deep:#061a1a;--cream:#f5f0e8;
  --cream-muted:rgba(245,240,232,.35);
}
body{background:linear-gradient(160deg,#04100f,#072020,#04100f);font-family:'Lato',sans-serif;color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
button{cursor:pointer;border:none;font-family:'Lato',sans-serif}
input{font-family:'Lato',sans-serif;outline:none}
.wrap{width:100%;max-width:400px}
.logo-area{text-align:center;margin-bottom:28px}
.logo{width:76px;height:76px;border-radius:50%;border:2px solid rgba(201,168,76,.3);box-shadow:0 0 32px rgba(201,168,76,.18);margin-bottom:12px;object-fit:cover}
.app-name{font-family:'Cinzel',serif;font-size:20px;letter-spacing:.22em;color:var(--gold-light)}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--cream-muted);margin-top:5px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.15);border-radius:24px;padding:32px 28px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),transparent)}
.title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.14em;color:var(--gold-light);text-align:center;margin-bottom:8px}
.sub{font-size:12px;color:var(--cream-muted);text-align:center;line-height:1.6;margin-bottom:20px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px}
.form{display:flex;flex-direction:column;gap:13px}
.field label{display:block;font-size:9px;letter-spacing:.14em;color:var(--cream-muted);margin-bottom:5px;font-family:'Cinzel',serif}
.field .box{position:relative}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.15);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--cream);transition:border-color .3s}
.field input.pw{padding-right:52px}
.field input:focus{border-color:rgba(201,168,76,.5);background:rgba(255,255,255,.07)}
.field input::placeholder{color:rgba(245,240,232,.2);font-style:italic}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:11px;letter-spacing:.04em;opacity:.45;user-select:none;background:none;color:var(--cream)}
.hint{font-size:10px;color:rgba(245,240,232,.3);margin-top:5px;font-style:italic}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--teal-deep);padding:14px;border-radius:50px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.12em;font-weight:700;box-shadow:0 6px 22px rgba(201,168,76,.2);margin-top:4px;transition:opacity .3s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:12px;border-radius:10px;padding:10px 14px;display:none;margin-bottom:14px;text-align:center;line-height:1.5}
.msg.show{display:block}
.err{color:#ff9090;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2)}
.ok{color:#90ffb0;background:rgba(50,200,100,.08);border:1px solid rgba(50,200,100,.2)}
.footer{font-size:12px;color:rgba(245,240,232,.3);margin-top:16px;text-align:center}
.footer a{color:var(--gold);text-decoration:none}
.view{display:none}
.view.active{display:block}
.spin{width:30px;height:30px;border:2px solid rgba(201,168,76,.18);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <img class="logo" src="/logo.png" alt="TAQWASTEPS"/>
    <div class="app-name">TAQWASTEPS</div>
    <div class="tagline">Walk With Faith · Each Step Toward Allah</div>
  </div>

  <div class="card">

    <!-- Checking the link -->
    <div class="view active" id="v-loading">
      <div class="title">CHECKING YOUR LINK</div>
      <div class="spin"></div>
    </div>

    <!-- Set a new password -->
    <div class="view" id="v-form">
      <div class="title">SET A NEW PASSWORD</div>
      <div class="sub">Choose a password with at least 8 characters.</div>
      <div class="msg err" id="formErr"></div>
      <div class="form">
        <div class="field"><label>NEW PASSWORD</label>
          <div class="box"><input class="pw" type="password" id="pw1" placeholder="Min. 8 characters" autocomplete="new-password"/><button type="button" class="eye" data-for="pw1">Show</button></div>
        </div>
        <div class="field"><label>CONFIRM PASSWORD</label>
          <div class="box"><input class="pw" type="password" id="pw2" placeholder="Type it again" autocomplete="new-password"/><button type="button" class="eye" data-for="pw2">Show</button></div>
        </div>
        <button class="btn" id="saveBtn">UPDATE PASSWORD</button>
      </div>
    </div>

    <!-- Expired or already used link -->
    <div class="view" id="v-expired">
      <div class="title">LINK EXPIRED</div>
      <div class="sub">This reset link has expired or has already been used. Enter your email to get a new one.</div>
      <div class="msg err" id="newErr"></div>
      <div class="msg ok" id="newOk"></div>
      <div class="form">
        <div class="field"><label>EMAIL</label><input type="email" id="newEmail" placeholder="your@email.com"/></div>
        <button class="btn" id="newBtn">SEND A NEW LINK</button>
      </div>
    </div>

    <div class="footer"><a id="signinLink" href="#">← Back to sign in</a></div>
  </div>
</div>

<script>
(function(){
  var SUPABASE_URL      = 'https://aknmebznbzrbxzyfkjin.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrbm1lYnpuYnpyYnh6eWZramluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDgwMjQsImV4cCI6MjA5MTY4NDAyNH0.A7kvNjXZkS8eQxvI9226ufIUyUnhqTFK_heAAolTZMg';
  var WEBAPP_URL        = 'https://webapp.taqwasteps.in/';           // where the sign-in page lives
  var RESET_URL         = 'https://taqwasteps.in/reset-password';   // must be in Supabase → Auth → Redirect URLs

  function g(id){ return document.getElementById(id); }
  function show(view){
    ['v-loading','v-form','v-expired'].forEach(function(v){ g(v).classList.toggle('active', v===view); });
  }
  function msg(id, text){ var el=g(id); el.textContent=text; el.classList.toggle('show', !!text); }

  g('signinLink').href = WEBAPP_URL;

  // Show / hide password
  document.querySelectorAll('.eye').forEach(function(b){
    b.addEventListener('click', function(){
      var inp=g(b.getAttribute('data-for'));
      var reveal = inp.type==='password';
      inp.type = reveal ? 'text' : 'password';
      b.textContent = reveal ? 'Hide' : 'Show';
      b.style.opacity = reveal ? '.85' : '.45';
    });
  });

  if(!window.supabase){
    show('v-expired');
    msg('newErr','Could not load. Please check your internet connection and refresh the page.');
    return;
  }

  // Did Supabase send an error back (expired / already used link)?
  var hash   = new URLSearchParams(window.location.hash.replace(/^#/,''));
  var query  = new URLSearchParams(window.location.search);
  var linkError = hash.get('error') || hash.get('error_code') || query.get('error') || query.get('error_code');

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, persistSession: true, flowType: 'implicit' }
  });

  if(linkError){
    try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
    show('v-expired');
  } else {
    sb.auth.getSession().then(function(res){
      try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
      if(res && res.data && res.data.session) show('v-form');
      else show('v-expired');
    }).catch(function(){ show('v-expired'); });
  }

  // Save the new password
  function savePassword(){
    msg('formErr','');
    var p1=g('pw1').value, p2=g('pw2').value;
    if(p1.length<8){ msg('formErr','Password must be at least 8 characters.'); return; }
    if(p1!==p2){ msg('formErr','Passwords do not match.'); return; }
    if(!navigator.onLine){ msg('formErr','No internet connection. Please try again.'); return; }
    var btn=g('saveBtn'); btn.disabled=true; btn.textContent='UPDATING...';
    sb.auth.updateUser({ password:p1 }).then(function(res){
      if(res.error){
        btn.disabled=false; btn.textContent='UPDATE PASSWORD';
        var m=(res.error.message||'')+'', code=res.error.code||'', st=res.error.status||0;
        if(code==='same_password' || /different from the old/i.test(m)){
          msg('formErr','Your new password must be different from your old one.');
        } else if(st===401 || code==='session_not_found' || code==='session_expired' || /session|jwt|expired/i.test(m)){
          show('v-expired');
        } else if(/failed to fetch|network/i.test(m)){
          msg('formErr','No internet connection. Please try again.');
        } else {
          msg('formErr', m || 'Could not update your password. Please try again.');
        }
        return;
      }
      sb.auth.signOut().catch(function(){}).then(function(){
        window.location.replace(WEBAPP_URL + '?msg=password-updated');
      });
    }).catch(function(){
      btn.disabled=false; btn.textContent='UPDATE PASSWORD';
      msg('formErr','No internet connection. Please try again.');
    });
  }
  g('saveBtn').addEventListener('click', savePassword);
  g('pw2').addEventListener('keydown', function(e){ if(e.key==='Enter') savePassword(); });

  // Request a new link
  var timer=null;
  function cooldown(secs){
    var btn=g('newBtn'), left=secs;
    btn.disabled=true; btn.textContent='RESEND IN '+left+'s';
    if(timer) clearInterval(timer);
    timer=setInterval(function(){
      left--;
      if(left<=0){ clearInterval(timer); timer=null; btn.disabled=false; btn.textContent='SEND A NEW LINK'; }
      else btn.textContent='RESEND IN '+left+'s';
    },1000);
  }
  function sendNew(){
    msg('newErr',''); msg('newOk','');
    var email=g('newEmail').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg('newErr','Please enter a valid email.'); return; }
    if(!navigator.onLine){ msg('newErr','No internet connection. Please try again.'); return; }
    var btn=g('newBtn'); btn.disabled=true; btn.textContent='SENDING...';
    sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_URL }).then(function(res){
      if(res && res.error && /failed to fetch|network/i.test(res.error.message||'')){
        btn.disabled=false; btn.textContent='SEND A NEW LINK';
        msg('newErr','No internet connection. Please try again.'); return;
      }
      msg('newOk',"If an account exists for this email, we've sent a reset link.");
      cooldown(60);
    }).catch(function(){
      btn.disabled=false; btn.textContent='SEND A NEW LINK';
      msg('newErr','No internet connection. Please try again.');
    });
  }
  g('newBtn').addEventListener('click', sendNew);
  g('newEmail').addEventListener('keydown', function(e){ if(e.key==='Enter') sendNew(); });
})();
</script>
</body>
</html>
